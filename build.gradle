
plugins {
	id 'net.fabricmc.fabric-loom-remap' version "${loom_version}"
	id 'maven-publish'
	id 'com.github.johnrengelman.shadow' version '8.1.1'
}

version = "${project.mod_version}+${sc.current.version}"
group = project.maven_group

/* Java version for each Minecraft version */
def javaVersionsInteger = [
		"26.1": 25,
		"1.21.11": 21,
		"1.21.10": 21,
		"1.21.9": 21,
		"1.21.8": 21
]

def javaVersionsEnums = [
		"26.1": JavaVersion.VERSION_25,
		"1.21.11": JavaVersion.VERSION_21,
		"1.21.10": JavaVersion.VERSION_21,
		"1.21.9": JavaVersion.VERSION_21,
		"1.21.8": JavaVersion.VERSION_21
]

/* Mod versions for each Minecraft version */
def fabricVersions = [
		"26.1": "0.144.0+26.1",
		"1.21.11": "0.140.0+1.21.11",
		"1.21.10": "0.138.4+1.21.10",
		"1.21.9": "0.134.1+1.21.9",
		"1.21.8": "0.136.1+1.21.8",

]
def clothConfigVersions = [
		"26.1": "26.1.154",
		"1.21.11": "21.11.153",
		"1.21.10": "20.0.149",
		"1.21.9": "20.0.149",
		"1.21.8": "19.0.147",

]
def modMenuVersions = [
		"26.1" : "18.0.0-alpha.8",
		"1.21.11" : "17.0.0",
		"1.21.10" : "16.0.1",
		"1.21.9" : "16.0.1",
		"1.21.8" : "15.0.2"
]

base {
	archivesName = project.archives_base_name
}

repositories {
	maven { url "https://maven.shedaniel.me/" }
	maven { url "https://maven.terraformersmc.com/releases/" }

	// Groovy version of the 'strict' helper
	exclusiveContent {
		forRepository {
			maven {
				url "https://api.modrinth.com/maven"
				name "Modrinth"
			}
		}
		filter {
			includeGroup "maven.modrinth"
		}
	}

	exclusiveContent {
		forRepository {
			maven {
				url "https://www.cursemaven.com"
				name "Curseforge"
			}
		}
		filter {
			includeGroup "curse.maven"
		}
	}
}

loom {
	splitEnvironmentSourceSets()

	mods {
		"legitmultiplayer" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}

}



var requiredFabric = fabricVersions[sc.current.version]


var requiredClothConfig = clothConfigVersions[sc.current.version]



var modMenuVersion = modMenuVersions[sc.current.version]

dependencies {
	// To change the versions see the gradle.properties file
	minecraft "com.mojang:minecraft:${sc.current.version}"
	mappings loom.officialMojangMappings()
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"


	// Fabric API. This is technically optional, but you probably want it anyway.
	modImplementation "net.fabricmc.fabric-api:fabric-api:${requiredFabric}"

	implementation "org.java-websocket:Java-WebSocket:1.5.3"
	implementation "dev.onvoid.webrtc:webrtc-java:0.14.0"
	implementation "dev.onvoid.webrtc:webrtc-java:0.14.0:windows-x86_64"
	implementation "dev.onvoid.webrtc:webrtc-java:0.14.0:macos-x86_64"
	// Standard 64-bit Linux (most common)
	implementation "dev.onvoid.webrtc:webrtc-java:0.14.0:linux-x86_64"

	// Linux ARM 64-bit (Raspberry Pi 4/5, Oracle Ampere, etc.)
	implementation "dev.onvoid.webrtc:webrtc-java:0.14.0:linux-aarch64"

	// Linux ARM 32-bit
	implementation "dev.onvoid.webrtc:webrtc-java:0.14.0:linux-aarch32"


	include "org.java-websocket:Java-WebSocket:1.5.3"

	modApi("me.shedaniel.cloth:cloth-config-fabric:${requiredClothConfig}") {
		exclude(group: "net.fabricmc.fabric-api")
	}


	def modMenuDep = "com.terraformersmc:modmenu:${modMenuVersion}"

	if (sc.current.version == "26.1") {
		implementation modMenuDep
		modRuntimeOnly modMenuDep
	} else {
		modCompileOnly modMenuDep
		modRuntimeOnly modMenuDep
	}

	implementation 'com.auth0:java-jwt:4.4.0'
	include 'com.auth0:java-jwt:4.4.0'

	implementation 'com.fasterxml.jackson.core:jackson-databind:2.15.2'
	include 'com.fasterxml.jackson.core:jackson-databind:2.15.2'

	// Sometimes you also need the annotations and core
	include 'com.fasterxml.jackson.core:jackson-annotations:2.15.2'
	include 'com.fasterxml.jackson.core:jackson-core:2.15.2'
	include "dev.onvoid.webrtc:webrtc-java:0.14.0"
	include "dev.onvoid.webrtc:webrtc-java:0.14.0:windows-x86_64"
	include "dev.onvoid.webrtc:webrtc-java:0.14.0:macos-x86_64"
	// Standard 64-bit Linux (most common)
	include "dev.onvoid.webrtc:webrtc-java:0.14.0:linux-x86_64"

	// Linux ARM 64-bit (Raspberry Pi 4/5, Oracle Ampere, etc.)
	include "dev.onvoid.webrtc:webrtc-java:0.14.0:linux-aarch64"

	// Linux ARM 32-bit
	include "dev.onvoid.webrtc:webrtc-java:0.14.0:linux-aarch32"
}

processResources {
	inputs.property "version", project.version

	filesMatching("fabric.mod.json") {
		expand(
				"version": project.version,
				"minecraft_version": sc.current.version
		)
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = javaVersionsInteger[sc.current.version]
}



java {
	// Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
	// if it is present.
	// If you remove this line, sources will not be generated.
	withSourcesJar()

	toolchain {
		languageVersion = JavaLanguageVersion.of(javaVersionsInteger[sc.current.version])
	}

	sourceCompatibility = javaVersionsEnums[sc.current.version]
	targetCompatibility = javaVersionsEnums[sc.current.version]
}

jar {
	inputs.property "archivesName", "project.base.archivesName+${sc.current.version}"

	from("LICENSE") {
		rename { "${it}_${inputs.properties.archivesName}"}
	}
}

// configure the maven publication
publishing {
	publications {
		create("mavenJava", MavenPublication) {
			artifactId = project.archives_base_name
			from components.java
		}
	}

	// See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
	repositories {
		// Add repositories to publish to here.
		// Notice: This block does NOT have the same function as the block in the top level.
		// The repositories here will be used for publishing your artifact, not for
		// retrieving dependencies.
	}
}